plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nutrimove'
    compileSdk 34

    defaultConfig {
        applicationId "com.nutrimove"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "OPENAI_API_KEY",
                "\"${project.findProperty("openai.api.key") ?: ""}\""

    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11 // Or your desired version
        targetCompatibility = JavaVersion.VERSION_11 // Or your desired version
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.0'
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    implementation "androidx.activity:activity-compose:1.8.0"
    implementation "com.airbnb.android:lottie-compose:6.1.0"


    // icons
    implementation("androidx.compose.material:material-icons-core:1.6.0") // Or the latest version
    implementation("androidx.compose.material:material-icons-extended:1.6.0") // Or the latest version

    // material 3 color schemes
    implementation "androidx.compose.ui:ui:1.5.0"
    implementation "androidx.compose.material3:material3:1.2.0" // This is for Compose M3 components
    implementation 'com.google.android.material:material:1.12.0'

    implementation "androidx.navigation:navigation-compose:2.7.3"
    implementation "androidx.datastore:datastore-preferences:1.0.0"
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
}